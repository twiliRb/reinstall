# shellcheck disable=SC2148
# 设置
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8
timezone Asia/Shanghai --utc
rootpw --plaintext 123@@@
text
reboot
%include /tmp/include-url-command

# 分区
%include /tmp/include-disk-only-use
%include /tmp/include-bootloader
clearpart --all --initlabel
reqpart # 如果需要，自动创建 efi 或 biosboot 分区
%include /tmp/include-filesystem

# 软件
%packages --ignoremissing # el9 minimal.iso fedora Server repo/iso 没有 tuned
@^Minimal Install
%include /tmp/include-packages-for-resize
%include /tmp/include-packages-for-filesystem
%include /tmp/exclude-packages-for-vm
%end

# 禁用防火墙
# firewall --disabled

# 禁用 selinux
selinux --disabled

# 禁用 kdump
%addon com_redhat_kdump --disable
%end

##############################################
%pre
distro=$(awk -F: '{ print $3 }' </etc/system-release-cpe)
releasever=$(awk -F: '{ print $5 }' </etc/system-release-cpe)

# 提取 extra 参数；这些值均按数据解析，不作为 shell 代码执行。
source_token=$(grep -oE 'extra_confhome_b64=[A-Za-z0-9+/=]+' /proc/cmdline | tail -n1)
if [ -n "$source_token" ]; then
    source_value=$(printf '%s' "${source_token#*=}" | base64 -d 2>/dev/null) || exit 1
else
    source_token=$(grep -oE 'extra_confhome=[^ ]+' /proc/cmdline | tail -n1)
    source_value=${source_token#extra_confhome=}
fi
case "$source_value" in
    https://raw.githubusercontent.com/twiliRb/reinstall/*)
        source_commit=${source_value#https://raw.githubusercontent.com/twiliRb/reinstall/} ;;
    *) echo "Missing pinned reinstall source." >&2; exit 1 ;;
esac
case "$source_commit" in *[!0-9a-f]* | '') echo "Invalid reinstall source commit." >&2; exit 1 ;; esac
[ "${#source_commit}" -eq 40 ] || { echo "Invalid reinstall source commit." >&2; exit 1; }
confhome="https://raw.githubusercontent.com/twiliRb/reinstall/$source_commit"
wget --tries=5 "$confhome/lib/reinstall-cmdline.sh" -O /reinstall-cmdline.sh || exit 1
wget --tries=5 "$confhome/lib/reinstall-btrfs-layout.sh" -O /reinstall-btrfs-layout.sh || exit 1
. /reinstall-cmdline.sh
. /reinstall-btrfs-layout.sh
reinstall_cmdline_load_file /proc/cmdline extra || exit 1

# Btrfs-root Kickstart is enabled only for Fedora. EL 10's Btrfs root support
# does not imply that its Anaconda/Kickstart stack supports the Fedora `btrfs`
# command; AlmaLinux uses the cloud-image conversion adapter instead.
filesystem=${filesystem:-ext4}
include=/tmp/include-filesystem
if [ "$filesystem" = btrfs ]; then
    case "$distro" in
        fedoraproject)
            [ "${btrfs_target_distro:-}" = fedora ] || {
                echo "Serialized Btrfs target identity is not Fedora." >&2
                exit 1
            }
            ;;
        almalinux)
            echo "Btrfs root is not wired through the AlmaLinux Kickstart adapter; use its cloud-image route." >&2
            exit 1
            ;;
        *)
            echo "Btrfs root is not supported by the selected Kickstart target: $distro." >&2
            exit 1
            ;;
    esac
    btrfs_target_releasever=${btrfs_target_releasever:-$releasever}
    [ "$btrfs_target_releasever" = "$releasever" ] || {
        echo "Serialized Btrfs target release does not match the Kickstart image." >&2
        exit 1
    }
    btrfs_kernel_variant=$(reinstall_btrfs_default_kernel_variant "$btrfs_target_distro" "$btrfs_target_releasever") || exit 1
    btrfs_root_options=$(reinstall_btrfs_validate_mount_options \
        "$btrfs_target_distro" "$btrfs_target_releasever" "$btrfs_kernel_variant" \
        "${btrfs_compression:-zstd}" "${btrfs_compression_level:-}" \
        "${btrfs_options:-}" "${btrfs_options_override:-0}") || {
        echo "Invalid or unsupported Btrfs options for $btrfs_target_distro $releasever." >&2
        exit 1
    }
    cat >"$include" <<'EOF'
part btrfs.01 --size=1 --grow
btrfs none --label=reinstall-root btrfs.01
btrfs / --subvol --name=@ LABEL=reinstall-root
btrfs /boot --subvol --name=@boot LABEL=reinstall-root
EOF
    printf '%s\n' btrfs-progs >/tmp/include-packages-for-filesystem
else
    [ "$filesystem" = ext4 ] || { echo "Invalid filesystem: $filesystem." >&2; exit 1; }
    : >"$include"
    : >/tmp/include-packages-for-filesystem
    echo 'part / --fstype=xfs --grow' >>"$include"
fi

# 只使用主硬盘
include=/tmp/include-disk-only-use
wget --tries=5 "$confhome/get-xda.sh" -O /tmp/reinstall-get-xda.sh || exit 1
[ -s /tmp/reinstall-get-xda.sh ] || { echo "Downloaded pinned get-xda.sh is empty." >&2; exit 1; }
xda=$(sh /tmp/reinstall-get-xda.sh) || exit 1
echo "ignoredisk --only-use=$xda" >$include

# 设置 tty
include=/tmp/include-bootloader
# shellcheck disable=SC2154
wget --tries=5 "$confhome/ttys.sh" -O /tmp/reinstall-ttys.sh || exit 1
[ -s /tmp/reinstall-ttys.sh ] || { echo "Downloaded pinned ttys.sh is empty." >&2; exit 1; }
console_cmdline=$(sh /tmp/reinstall-ttys.sh console=) || exit 1
echo "bootloader --append=\"$console_cmdline\"" >$include

# 有 installer 分区，表示用了两步安装
include=/tmp/include-packages-for-resize
touch $include
if [ -e /dev/disk/by-label/installer ]; then
    # 1g内存下，安装器默认开启了zram ，但安装f38还是不够内存
    # 具体表现为不断重启安装界面，所以还要开启swap
    ram_size=$(lsmem -b 2>/dev/null | grep 'Total online memory:' | awk '{ print $NF/1024/1024 }')
    if [ -z "$ram_size" ] || [ "$ram_size" -le 1024 ]; then
        mount /dev/disk/by-label/installer /run/install/repo -o remount,rw
        swapfile=/run/install/repo/swapfile
        if command -v fallocate; then
            fallocate -l 1G $swapfile
        else
            dd if=/dev/zero of=$swapfile bs=1M count=1024
        fi
        chmod 0600 $swapfile
        mkswap $swapfile
        swapon $swapfile
    fi

    # feroda 默认不包含 cronie
    echo cronie >>$include

    # el7 的parted不支持在线扩容，要用 growpart 和 gdisk 处理 gpt 分区
    if [ "$releasever" = "7" ]; then
        echo cloud-utils-growpart >>$include
        echo gdisk >>$include
    fi
fi

# 排除虚拟机用不上的组件
include=/tmp/exclude-packages-for-vm
touch $include
if systemd-detect-virt -v; then
    cat <<EOF >$include
        # 不删除usb相关的包 因为甲骨文云有usb设备 作用未知
        # -usb_modeswitch
        # -usbutils

        # 无线
        -iw
        -crda
        -rfkill
        -iwl*-firmware

        # 其他
        -irqbalance # 多核+直通设备可能有用？
        -microcode_ctl
        -smartmontools

        # 各种固件
        -aic94xx-firmware
        -alsa-firmware
        -ivtv-firmware
        # -linux-firmware # 去除后安装centos 8会报错

        # fedora 特有固件
        -amd-gpu-firmware
        -atheros-firmware
        -brcmfmac-firmware
        -intel-gpu-firmware
        -mt7xxx-firmware
        -nvidia-gpu-firmware
        -realtek-firmware
EOF
fi

# 设置安装源
include=/tmp/include-url-command
# shellcheck disable=SC2154
if [ "$localtest" = 1 ]; then
    echo "url --url=$confhome/$releasever/" >$include
    # echo cdrom >$include
else
    echo "url --mirrorlist=$mirrorlist" >$include
    # 对于el7/fedora, 添加了 updates repo 才会安装最新的包
    if [ "$releasever" = "7" ] || [ "$distro" = "fedoraproject" ]; then
        echo "repo --name=updates" >>$include
    fi
fi
%end

%pre-install --erroronfail
. /reinstall-cmdline.sh || exit 1
reinstall_cmdline_load_file /proc/cmdline extra || exit 1
distro=$(awk -F: '{ print $3 }' </etc/system-release-cpe)
releasever=$(awk -F: '{ print $5 }' </etc/system-release-cpe)
filesystem=${filesystem:-ext4}
if [ "$filesystem" = btrfs ]; then
    [ "${btrfs_target_distro:-}" = fedora ] || { echo "Kickstart Btrfs target identity is not Fedora." >&2; exit 1; }
    btrfs_target_releasever=${btrfs_target_releasever:-$releasever}
    [ "$btrfs_target_releasever" = "$releasever" ] || { echo "Kickstart Btrfs release identity mismatch." >&2; exit 1; }
    btrfs_kernel_variant=$(reinstall_btrfs_default_kernel_variant "$btrfs_target_distro" "$btrfs_target_releasever") || exit 1
    btrfs_root_options=$(reinstall_btrfs_validate_mount_options \
        "$btrfs_target_distro" "$btrfs_target_releasever" "$btrfs_kernel_variant" \
        "${btrfs_compression:-zstd}" "${btrfs_compression_level:-}" \
        "${btrfs_options:-}" "${btrfs_options_override:-0}") || exit 1
    target_root=/mnt/sysroot
    [ -d "$target_root/boot" ] || { echo "Anaconda did not mount the Btrfs boot subvolume." >&2; exit 1; }
    [ "$(findmnt -n -o FSTYPE --target "$target_root")" = btrfs ] || {
        echo "Anaconda root is not mounted as Btrfs." >&2; exit 1;
    }
    [ "$(findmnt -n -o FSTYPE --target "$target_root/boot")" = btrfs ] || {
        echo "Anaconda /boot is not mounted as Btrfs." >&2; exit 1;
    }
    if [ -n "${btrfs_root_options:-}" ]; then
        mount -o "remount,$btrfs_root_options" "$target_root" || exit 1
    fi
    # Mark the empty @boot before RPM installs the kernel and initramfs. New
    # files inherit NOCOMPRESS while the filesystem-wide mount options stay
    # consistent with the root subvolume.
    chattr +m "$target_root/boot" || exit 1
    case "$(lsattr -d "$target_root/boot" | awk '{print $1}')" in *m*) ;; *) exit 1 ;; esac
fi
%end

##############################################
%post
# el9/fedora的sshd默认不允许root密码登录，需手动开启
# rootpw --allow-ssh 9.1 以上才支持
distro=$(awk -F: '{ print $3 }' </etc/system-release-cpe)
releasever=$(awk -F: '{ print $5 }' </etc/system-release-cpe)
if [ "$releasever" = "9" ] || [ "$distro" = "fedoraproject" ]; then
    echo "PermitRootLogin yes" >/etc/ssh/sshd_config.d/01-permitrootlogin.conf
fi

# Kickstart runs each section in a fresh shell. Decode the filesystem selector
# before deciding whether to load the Btrfs helper; the `%pre` variables are
# not inherited by `%post`.
filesystem=ext4
filesystem_token=$(grep -oE 'extra_filesystem_b64=[A-Za-z0-9+/=]+' /proc/cmdline | tail -n1)
if [ -n "$filesystem_token" ]; then
    filesystem=$(printf '%s' "${filesystem_token#*=}" | base64 -d 2>/dev/null) || exit 1
fi
case "$filesystem" in ext4 | btrfs) ;; *) echo "Invalid serialized filesystem selector." >&2; exit 1 ;; esac
if [ "$filesystem" = btrfs ]; then
    case "$distro" in
        fedoraproject) ;;
        *) echo "Unexpected Kickstart Btrfs target: $distro." >&2; exit 1 ;;
    esac
    source_token=$(grep -oE 'extra_confhome_b64=[A-Za-z0-9+/=]+' /proc/cmdline | tail -n1)
    if [ -n "$source_token" ]; then
        source_value=$(printf '%s' "${source_token#*=}" | base64 -d 2>/dev/null) || exit 1
    else
        source_token=$(grep -oE 'extra_confhome=[^ ]+' /proc/cmdline | tail -n1)
        source_value=${source_token#extra_confhome=}
    fi
    case "$source_value" in
        https://raw.githubusercontent.com/twiliRb/reinstall/*)
            source_commit=${source_value#https://raw.githubusercontent.com/twiliRb/reinstall/} ;;
        *) echo "Missing pinned reinstall source for Btrfs setup." >&2; exit 1 ;;
    esac
    case "$source_commit" in *[!0-9a-f]* | '') echo "Invalid pinned reinstall source commit." >&2; exit 1 ;; esac
    [ "${#source_commit}" -eq 40 ] || { echo "Invalid pinned reinstall source commit." >&2; exit 1; }
    confhome="https://raw.githubusercontent.com/twiliRb/reinstall/$source_commit"
    curl -fL "$confhome/lib/reinstall-cmdline.sh" -o /tmp/reinstall-cmdline.sh || exit 1
    curl -fL "$confhome/lib/reinstall-btrfs-layout.sh" -o /tmp/reinstall-btrfs-layout.sh || exit 1
    . /tmp/reinstall-cmdline.sh
    . /tmp/reinstall-btrfs-layout.sh
    reinstall_cmdline_load_file /proc/cmdline extra || exit 1
    [ "${btrfs_target_distro:-}" = fedora ] || { echo "Kickstart Btrfs target identity is not Fedora." >&2; exit 1; }
    btrfs_target_releasever=${btrfs_target_releasever:-$releasever}
    [ "$btrfs_target_releasever" = "$releasever" ] || { echo "Kickstart Btrfs release identity mismatch." >&2; exit 1; }
    btrfs_root_options=$(reinstall_btrfs_validate_mount_options \
        "$btrfs_target_distro" "$btrfs_target_releasever" default \
        "${btrfs_compression:-zstd}" "${btrfs_compression_level:-}" \
        "${btrfs_options:-}" "${btrfs_options_override:-0}") || exit 1
    root_uuid=$(findmnt -n -o UUID --target /)
    [ -n "$root_uuid" ] || { echo "Cannot identify the installed Btrfs UUID." >&2; exit 1; }
    efi_uuid=
    if [ "$(findmnt -n -o FSTYPE --target /boot/efi 2>/dev/null || true)" = vfat ]; then
        efi_uuid=$(findmnt -n -o UUID --target /boot/efi) || exit 1
        reinstall_btrfs_valid_efi_uuid "$efi_uuid" || { echo "Invalid installed EFI UUID." >&2; exit 1; }
    fi
    if [ -n "$efi_uuid" ]; then
        reinstall_btrfs_write_fstab / "$root_uuid" @ @boot "$btrfs_root_options" "$efi_uuid" /boot/efi || exit 1
    else
        reinstall_btrfs_write_fstab / "$root_uuid" @ @boot "$btrfs_root_options" || exit 1
    fi
    rootflags=$(reinstall_btrfs_kernel_rootflags @ "$btrfs_root_options") || exit 1
    command -v grubby >/dev/null 2>&1 || { echo "grubby is required to persist Btrfs rootflags." >&2; exit 1; }
    grubby --update-kernel=ALL --args="rootfstype=btrfs $rootflags" || exit 1
    mkdir -p /etc/dracut.conf.d
    echo 'add_dracutmodules+=" btrfs "' >/etc/dracut.conf.d/90-reinstall-btrfs.conf
    dracut -f --regenerate-all || exit 1
    echo "CHECKPOINT btrfs/kickstart: distro=$btrfs_target_distro release=$btrfs_target_releasever root=@ boot=@ options=${btrfs_root_options:-none} rootflags=$rootflags"
fi

# 分步安装的系统，要将最后一个分区（installer）合并到系统分区
if [ -e /dev/disk/by-label/installer ]; then
    # Resolve the pinned source without relying on the installer helper in the target chroot.
    source_token=$(grep -oE 'extra_confhome_b64=[A-Za-z0-9+/=]+' /proc/cmdline | tail -n1)
    if [ -n "$source_token" ]; then
        source_value=$(printf '%s' "${source_token#*=}" | base64 -d 2>/dev/null) || exit 1
    else
        source_token=$(grep -oE 'extra_confhome=[^ ]+' /proc/cmdline | tail -n1)
        source_value=${source_token#extra_confhome=}
    fi
    case "$source_value" in
        https://raw.githubusercontent.com/twiliRb/reinstall/*)
            source_commit=${source_value#https://raw.githubusercontent.com/twiliRb/reinstall/} ;;
        *) echo "Missing pinned reinstall source." >&2; exit 1 ;;
    esac
    case "$source_commit" in *[!0-9a-f]* | '') echo "Invalid reinstall source commit." >&2; exit 1 ;; esac
    [ "${#source_commit}" -eq 40 ] || { echo "Invalid reinstall source commit." >&2; exit 1; }
    confhome="https://raw.githubusercontent.com/twiliRb/reinstall/$source_commit"

    cd /
    curl -fLO "$confhome/deprecated/resize.sh" || exit 1
    [ -s /resize.sh ] || { echo "Downloaded pinned resize.sh is empty." >&2; exit 1; }
    echo '@reboot root bash /resize.sh' >/etc/cron.d/resize
fi
%end
