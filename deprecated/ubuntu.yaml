#cloud-config
# 顺序 early-commands > 安装系统 > late-commands > 重启进入系统 > cloud-init: runcmd > cloud-init: 其他
autoinstall:
  version: 1
  apt:
    fallback: offline-install
  source:
    id: "@SOURCE_ID@"
  kernel:
    package: linux-generic
  timezone: Asia/Shanghai
  ssh:
    allow-pw: true
    authorized-keys: []
    install-server: true
  early-commands:
    - |
      # 解决 20.04 不能识别硬盘
      # https://askubuntu.com/questions/1302392/ubuntu-server-20-04-setup-stuck-at-block-probing-did-not-discover-any-disks
      mount | grep /isodevice && { losetup -d /dev/loop0; umount -l /isodevice; } || true

      # The ISO initrd is not the project initrd, so bootstrap the pinned parser.
      source_token=$(grep -oE 'extra_confhome_b64=[A-Za-z0-9+/=]+' /proc/cmdline | tail -n1)
      if [ -n "$source_token" ]; then
        source_value=$(printf '%s' "${source_token#*=}" | base64 -d 2>/dev/null) || exit 1
      else
        source_token=$(grep -oE 'extra_confhome=[^ ]+' /proc/cmdline | tail -n1)
        source_value=${source_token#extra_confhome=}
      fi
      case "$source_value" in
        https://raw.githubusercontent.com/twiliRb/reinstall/*)
          source_commit=${source_value#https://raw.githubusercontent.com/twiliRb/reinstall/} ;;
        *) echo "Missing pinned reinstall source." >&2; exit 1 ;;
      esac
      case "$source_commit" in *[!0-9a-f]* | '') echo "Invalid reinstall source commit." >&2; exit 1 ;; esac
      [ "${#source_commit}" -eq 40 ] || { echo "Invalid reinstall source commit." >&2; exit 1; }
      confhome="https://raw.githubusercontent.com/twiliRb/reinstall/$source_commit"
      curl -fsSL "$confhome/lib/reinstall-cmdline.sh" -o /reinstall-cmdline.sh || exit 1

      # Parse extra values as data, using the parser embedded in the initrd.
      . /reinstall-cmdline.sh
      reinstall_cmdline_load_file /proc/cmdline extra || exit 1

      # 生成分区信息
      curl -fsSL "$confhome/get-xda.sh" -o /tmp/reinstall-get-xda.sh || exit 1
      [ -s /tmp/reinstall-get-xda.sh ] || exit 1
      xda=$(sh /tmp/reinstall-get-xda.sh) || exit 1
      export xda
      curl -fsSL "$confhome/deprecated/ubuntu-storage-early.sh" \
        -o /tmp/reinstall-ubuntu-storage-early.sh || exit 1
      [ -s /tmp/reinstall-ubuntu-storage-early.sh ] || exit 1
      sh /tmp/reinstall-ubuntu-storage-early.sh || exit 1

      # 要安装的版本
      # 有的镜像只有一个版本，没有 install-sources.yaml
      # 因此提取不到 $source_id，此时 $source_id 参数为空
      if [ -n "$source_id" ]; then
          sed -i "s/@SOURCE_ID@/$source_id/" /autoinstall.yaml
      else
          sed -i "/@SOURCE_ID@/d" /autoinstall.yaml
      fi

      # 内核风味
      # https://bugs.launchpad.net/subiquity/+bug/1989353
      sed -i "s/generic/$kernel/" /run/kernel-meta-package
      sed -i "/package:/s/generic/$kernel/" /autoinstall.yaml

      # 跳过最后的更新
      cp /usr/sbin/chroot /usr/sbin/chroot.bin
      cat >/usr/sbin/chroot <<EOF
      #!/bin/sh
      [ "\$2" = "unattended-upgrades" ] || /usr/sbin/chroot.bin "\$@"
      EOF

      # 禁用 DNS  强制离线安装内核和跳过最后的更新
      # 但安装器会配置时区和写入最近的mirror到/etc/apt/sources.list 所以要提前解析
      # dig会显示cname结果，cname会以.结尾，grep -v '\.$' 表示去除 cname 结果
      # echo $(dig +short geoip.ubuntu.com | grep -v '\.$' | head -1) geoip.ubuntu.com >>/etc/hosts
      # sed -i -E 's/(^nameserver )/#\1/' /etc/resolv.conf
  late-commands:
    - |
      # root ssh 登录
      echo "PermitRootLogin yes" >/target/etc/ssh/sshd_config.d/01-permitrootlogin.conf

      # 还原 DNS
      # sed -i -E 's/^#(nameserver )/\1/' /etc/resolv.conf

      # Re-establish the same pinned helper source in the installer environment.
      source_token=$(grep -oE 'extra_confhome_b64=[A-Za-z0-9+/=]+' /proc/cmdline | tail -n1)
      if [ -n "$source_token" ]; then
        source_value=$(printf '%s' "${source_token#*=}" | base64 -d 2>/dev/null) || exit 1
      else
        source_token=$(grep -oE 'extra_confhome=[^ ]+' /proc/cmdline | tail -n1)
        source_value=${source_token#extra_confhome=}
      fi
      case "$source_value" in
        https://raw.githubusercontent.com/twiliRb/reinstall/*)
          source_commit=${source_value#https://raw.githubusercontent.com/twiliRb/reinstall/} ;;
        *) echo "Missing pinned reinstall source." >&2; exit 1 ;;
      esac
      case "$source_commit" in *[!0-9a-f]* | '') echo "Invalid reinstall source commit." >&2; exit 1 ;; esac
      [ "${#source_commit}" -eq 40 ] || { echo "Invalid reinstall source commit." >&2; exit 1; }
      confhome="https://raw.githubusercontent.com/twiliRb/reinstall/$source_commit"
      curl -fsSL "$confhome/lib/reinstall-cmdline.sh" -o /reinstall-cmdline.sh || exit 1

      # Parse extra values as data, using the parser embedded in the initrd.
      . /reinstall-cmdline.sh
      reinstall_cmdline_load_file /proc/cmdline extra || exit 1

      # 下载合并分区脚本
      cd /target
      curl -fsSLO "$confhome/deprecated/resize.sh" || exit 1
      [ -s /target/resize.sh ] || exit 1

      # 升级 cloud-init
      # curtin in-target --target=/target -- apt update
      # curtin in-target --target=/target -- apt install --only-upgrade cloud-init
  user-data:
    runcmd:
      - |
        # 合并分区
        bash /resize.sh
    disable_root: false
    users:
      - name: root
        lock_passwd: false
    chpasswd:
      expire: false
      # 20.04 arm 需要
      list: |
        root:123@@@
      users:
        - name: root
          password: 123@@@
          type: text
