name: CI

on:
  pull_request:
    branches: [custom]
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/custom'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck xmlstarlet
      - name: Check shell syntax
        run: find . -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 -n1 bash -n
      - name: Run ShellCheck
        run: find . -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 shellcheck --severity=error
      - name: Test command-line and Windows serializers
        run: |
          bash tests/test_reinstall_cmdline.sh
          bash tests/test_windows_serialize.sh
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  smoke:
    name: Installer smoke (${{ matrix.os }})
    if: (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/custom') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: static
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      REINSTALL_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run Linux smoke checks
        if: runner.os == 'Linux'
        run: |
          sudo env REINSTALL_SOURCE_COMMIT="$REINSTALL_SOURCE_COMMIT" bash reinstall.sh --debug --username x --password x almalinux
          sudo env REINSTALL_SOURCE_COMMIT="$REINSTALL_SOURCE_COMMIT" bash reinstall.sh --debug --username x --password x ubuntu
          sudo env REINSTALL_SOURCE_COMMIT="$REINSTALL_SOURCE_COMMIT" bash reinstall.sh --debug --username x --password x debian
          sudo env REINSTALL_SOURCE_COMMIT="$REINSTALL_SOURCE_COMMIT" bash reinstall.sh --debug --username x --password x debian --ci
          sudo env REINSTALL_SOURCE_COMMIT="$REINSTALL_SOURCE_COMMIT" bash reinstall.sh --debug netboot.xyz
          sudo env REINSTALL_SOURCE_COMMIT="$REINSTALL_SOURCE_COMMIT" bash reinstall.sh --debug --username x --password x dd --img=https://cloud.debian.org/images/cloud/sid/daily/latest/debian-sid-nocloud-amd64-daily.tar.xz
          sudo env REINSTALL_SOURCE_COMMIT="$REINSTALL_SOURCE_COMMIT" bash reinstall.sh --debug --username x --password x windows --image-name='Windows Server blah' --iso https://aka.ms/HCIReleaseImage
          sudo env REINSTALL_SOURCE_COMMIT="$REINSTALL_SOURCE_COMMIT" bash reinstall.sh --debug reset
      - name: Run Windows smoke checks
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call reinstall.bat --debug --username x --password x almalinux || exit /b 1
          call reinstall.bat --debug --username x --password x ubuntu || exit /b 1
          call reinstall.bat --debug --username x --password x debian || exit /b 1
          call reinstall.bat --debug --username x --password x debian --ci || exit /b 1
          call reinstall.bat --debug netboot.xyz || exit /b 1
          call reinstall.bat --debug --username x --password x dd --img=https://cloud.debian.org/images/cloud/sid/daily/latest/debian-sid-nocloud-amd64-daily.tar.xz || exit /b 1
          call reinstall.bat --debug --username x --password x windows --image-name="Windows Server blah" --iso https://aka.ms/HCIReleaseImage || exit /b 1
          call reinstall.bat --debug reset || exit /b 1
